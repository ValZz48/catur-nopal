<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 140" width="100%" height="100%">
  <!-- Background: warm cream matching light theme -->
  <rect width="100%" height="100%" fill="#EDE4D3" rx="12" />
  
  <g transform="translate(18, 14)">
    <!-- Icon Container: Dark charcoal rounded rectangle with smooth corners -->
    <rect x="0" y="0" width="112" height="112" rx="28" fill="#282421" />
    
    <!-- Gold Star Sparkle (top-right of icon) -->
    <path d="M84 22 L86.5 29.5 L94 32 L86.5 34.5 L84 42 L81.5 34.5 L74 32 L81.5 29.5 Z" fill="#E0A81A" />
    
    <!-- White Queen Chess Piece Silhouette -->
    <g fill="#FFFFFF" transform="translate(24, 20) scale(1.4)">
      <!-- 5 Crown circles -->
      <circle cx="6" cy="11" r="2.2" />
      <circle cx="15" cy="6" r="2.2" />
      <circle cx="23" cy="4" r="2.5" />
      <circle cx="31" cy="6" r="2.2" />
      <circle cx="40" cy="11" r="2.2" />
      
      <!-- Queen body -->
      <path d="M 6 15 C 13 14 33 14 40 15 C 42 27 34 38 33 42 C 30 40 27 41 23 41 C 19 41 16 40 13 42 C 12 38 4 27 6 15 Z" />
      
      <!-- Queen waist/base structure -->
      <path d="M 8 44 C 8 42 11 42 13 43 C 18 41 28 41 33 43 C 35 42 38 42 38 44 C 38 46 36 47 34 49 C 32 51 32 52 33 54 C 34 56 31 58 15 58 C 12 58 12 56 13 54 C 14 52 14 51 12 49 C 10 47 8 46 8 44 Z" />
      
      <!-- Base pedestal -->
      <path d="M 10 59 L 36 59 C 38 59 39 61 39 63 L 7 63 C 7 61 8 59 10 59 Z" />
    </g>
  </g>
  
  <!-- Text: Pal (Dark Charcoal) -->
  <text x="150" y="90" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" font-size="64" fill="#201B15" letter-spacing="-1.5px">Pal</text>
  
  <!-- Text: Mate (Vibrant Chess Green) -->
  <text x="254" y="90" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" font-size="64" fill="#81B64C" letter-spacing="-1.5px">Mate</text>
</svg>
